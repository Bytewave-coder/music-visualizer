name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean Old Dependencies
        run: |
          rm -rf node_modules
          rm -rf package-lock.json
          npm cache clean --force

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Next Config
        run: |
          cat > next.config.js << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',

            typescript: {
              ignoreBuildErrors: true,
            },

            eslint: {
              ignoreDuringBuilds: true,
            },

            images: {
              unoptimized: true,
            },
          };

          module.exports = nextConfig;
          EOF

      - name: Build Next.js App
        run: npm run build

      - name: Prepare Static Output
        run: |
          mkdir -p out

          cp -r .next/static out/static || true

          cp -r public/* out/ || true

      - name: Install Capacitor 6
        run: |
          npm uninstall @capacitor/core @capacitor/cli @capacitor/android || true

          npm install \
            @capacitor/core@6.1.2 \
            @capacitor/cli@6.1.2 \
            @capacitor/android@6.1.2 \
            --legacy-peer-deps

      - name: Initialize Capacitor
        run: |
          npx cap init "Music Visualizer" "com.bytewave.musicvisualizer" --web-dir=out || true

      - name: Add Android Platform
        run: |
          npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Gradle Java Version
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-visualizer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
