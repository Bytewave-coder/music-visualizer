name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean Old Files
        run: |
          rm -rf node_modules
          rm -rf android
          rm -f package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Next Config
        run: |
          cat > next.config.js << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            typescript: {
              ignoreBuildErrors: true,
            },
            eslint: {
              ignoreDuringBuilds: true,
            },
            output: 'export',
            images: {
              unoptimized: true,
            },
          };

          module.exports = nextConfig;
          EOF

      - name: Build Next.js App
        run: npm run build

      - name: Export Static Files
        run: npx next export

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Initialize Capacitor
        run: |
          npx cap init "Music Visualizer" "com.bytewave.musicvisualizer" --web-dir=out

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Gradle Java Version
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Force Java 17 Compatibility
        run: |
          sed -i '/compileOptions {/a \
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17' android/app/build.gradle || true

          sed -i '/kotlinOptions {/a \
                  jvmTarget = "17"' android/app/build.gradle || true

      - name: Fix Kotlin Conflict
        run: |
          echo "kotlin.stdlib.default.dependency=false" >> android/gradle.properties

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-visualizer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
